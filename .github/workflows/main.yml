name: Ionic Vue Docker CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # 1. Get the latest source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Check Docker installation
      - name: Check Docker
        run: docker --version

      # 3. Build the Ionic Vue application image
      - name: Build Docker Image
        run: docker build -t cedricbakin06/ionic-vue-firebase-crud:latest .

      # 4. Push image to Docker Hub
      - name: Push Docker Image
        run: docker push cedricbakin06/ionic-vue-firebase-crud:latest

      # 5. Stop and remove the previous container
      - name: Stop Existing Container
        shell: powershell
        run: |
          $container = docker ps -aq --filter "name=^ionic-vue-app$"

          if ($container) {
            docker stop ionic-vue-app
            docker rm ionic-vue-app
          }

      # 6. Download the latest image
      - name: Pull Latest Docker Image
        run: docker pull cedricbakin06/ionic-vue-firebase-crud:latest

      # 7. Run the updated container
      - name: Run Updated Container
        run: docker run -d -p 8080:80 --name ionic-vue-app --restart unless-stopped cedricbakin06/ionic-vue-firebase-crud:latest

      # 8. Verify running container
      - name: Verify Deployment
        run: docker ps