name: Ionic Vue Docker CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        shell: powershell
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker is unavailable"
          }

      - name: Validate Docker Hub secrets
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "DOCKERHUB_USERNAME is missing. Add your Docker Hub username as a repository secret."
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "DOCKERHUB_TOKEN is missing. Add a Docker Hub access token as a repository secret."
          }

      - name: Log in to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub rejected the credentials. Verify DOCKERHUB_USERNAME is the account username and DOCKERHUB_TOKEN is a valid access token for that account."
          }
