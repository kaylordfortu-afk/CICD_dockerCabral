
name: CI-CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  continuous-integration:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test --if-present

      - name: Build application
        run: npm run build

  continuous-deployment:
    needs: continuous-integration
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ionic-crud-app .

      - name: Remove previous container
        run: docker rm -f ionic-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:8100 ionic-crud-app

      - name: Verify application
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }
